<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A pomodoro timer with five worlds: cute, minimal, 80s, retro and dark academia.">
<title>Pomo Worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Karla:wght@400;500;700;800&family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Orbitron:wght@500;700;900&family=Audiowide&family=Press+Start+2P&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a neutral welcome gallery, then each world takes the whole screen with its own skin over one shared timer skeleton */
:root{
  --h-bg:#ECEEF3; --h-card:#FFFFFF; --h-fg:#1B1C22; --h-muted:#565A6B; --h-line:#D3D6E0; --h-accent:#2F3380; --h-accent-fg:#FFFFFF; --h-b1:#FFC2D2; --h-b2:#BFCBFF; --h-b3:#FFE0B0;
  --f-display:'Bricolage Grotesque', 'Karla', system-ui, sans-serif; --f-body:'Karla', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--h-bg:#13141A;--h-card:#1D1F27;--h-fg:#ECEDF2;--h-muted:#A3A7B7;--h-line:#2D303B;--h-accent:#B3B7FF;--h-accent-fg:#13141A;--h-b1:#5A2748;--h-b2:#26336E;--h-b3:#5A4520;color-scheme:dark}}
:root[data-theme="dark"]{--h-bg:#13141A;--h-card:#1D1F27;--h-fg:#ECEDF2;--h-muted:#A3A7B7;--h-line:#2D303B;--h-accent:#B3B7FF;--h-accent-fg:#13141A;--h-b1:#5A2748;--h-b2:#26336E;--h-b3:#5A4520;color-scheme:dark}
html,body{height:100%}
body{background:var(--h-bg);color:var(--h-fg);font-family:var(--f-body)}
#app{min-height:100%;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus,var(--h-accent));outline-offset:3px}
svg{display:block}

/* ---------- Home ---------- */
.home{flex:1;box-sizing:border-box;padding-inline:clamp(16px,4vw,64px);padding-block:clamp(20px,4vh,44px);display:flex;flex-direction:column;gap:clamp(20px,3.5vh,34px);max-width:1360px;width:100%;margin-inline:auto}
.home-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.home-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em}
.home-brand small{font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--h-muted)}
.home h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(38px,6vw,68px);line-height:.98;letter-spacing:-.035em;text-wrap:balance}
.home-lede{margin:10px 0 0;font-size:clamp(16px,1.6vw,19px);line-height:1.5;color:var(--h-muted);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;padding:8px 8px 16px;border-radius:24px;border:3px solid transparent;background:var(--h-card);text-align:left;box-shadow:0 10px 26px -18px rgba(20,22,40,.45);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px));transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .25s,border-color .2s}
.card:hover{--lift:-6px;box-shadow:0 30px 44px -22px rgba(20,22,40,.55)}
.card[aria-checked="true"]{border-color:var(--h-fg);box-shadow:0 24px 40px -20px rgba(20,22,40,.55)}
.pv{position:relative;height:200px;border-radius:16px;overflow:hidden}
.card-body{padding:14px 8px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.card-name{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.card-desc{font-size:14px;line-height:1.45;color:var(--h-muted)}
.card-sound{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--h-muted)}
.home-foot{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;padding-top:18px;border-top:1px solid var(--h-line)}
.pal-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.pal-row b{font-weight:800;font-size:14px}
.pal-row span{font-size:14px;color:var(--h-muted)}
.sw-list{display:flex;gap:4px}
.sw{width:48px;height:48px;border-radius:50%;padding:0;border:3px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center}
.sw[aria-checked="true"]{border-color:var(--sw-ring,var(--h-fg))}
.sw i{display:block;width:32px;height:32px;border-radius:50%;box-shadow:0 3px 6px -2px rgba(0,0,0,.35),inset -3px -4px 8px rgba(0,0,0,.14)}
.enter{height:56px;display:inline-flex;align-items:center;gap:12px;padding:0 28px;border-radius:999px;border:none;background:var(--h-fg);color:var(--h-bg);font-weight:800;font-size:16px;transition:transform .15s}
.enter:active{transform:translateY(2px)}

/* ---------- World skeleton ---------- */
.world{position:relative;flex:1;min-height:100%;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;padding-inline:clamp(16px,4vw,56px);padding-block:clamp(14px,2.6vh,30px);--d:min(78vw,44vh,380px)}
.bg-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bar,.stage,.floor{position:relative;z-index:1}
.bar{display:flex;align-items:center;gap:10px}
.brand{margin-right:auto;display:flex;align-items:center;gap:10px;min-width:0}
.ibtn{width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.4vh,34px);padding-block:clamp(10px,2vh,22px)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.core{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(22px,5vw,80px);max-width:100%}
.dial{position:relative;width:var(--d);height:var(--d);flex:none;max-width:100%}
.dial-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.clock{font-variant-numeric:tabular-nums;line-height:1}
.side{display:flex;flex-direction:column;align-items:center;gap:18px}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.dots{display:flex;gap:8px;align-items:center}
.eye-happy,.cup,.note{display:none}
.running .eye-happy{display:inline}
.running .eye-open{display:none}
.ibtn.back{width:auto;padding:0 18px;gap:8px;border-radius:999px;font-weight:800;font-size:14px;letter-spacing:.04em}
.w-retro .ibtn.back{border-radius:0;font-size:10px}
.w-minimal .ibtn.back,.w-academia .ibtn.back{text-transform:uppercase;letter-spacing:.2em;font-size:12px}
.w-eighties .ibtn.back{border-radius:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
@media (max-width:420px){.ibtn.back{padding:0 14px}.back-label{display:none}}
@media (max-width:760px){.hide-sm{display:none !important}}

/* overlays share the world skin through --ov tokens */
.toast{position:absolute;z-index:30;left:50%;top:clamp(76px,11vh,110px);transform:translateX(-50%);width:min(560px,calc(100% - 32px));box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:16px 18px;border-radius:var(--ov-radius);background:var(--ov-bg);color:var(--ov-fg);border:2px solid var(--ov-line);box-shadow:0 24px 50px -20px rgba(0,0,0,.45);font-family:var(--ov-font);animation:pop .35s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-10px) scale(.95)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.toast-text{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:3px}
.toast-text b{font-family:var(--ov-display);font-size:19px}
.toast-text span{font-size:14px;opacity:.85;line-height:1.4}
.ov-btn{min-height:44px;padding:0 18px;border-radius:var(--ov-radius);border:2px solid var(--ov-line);background:transparent;color:var(--ov-fg);font-family:var(--ov-font);font-weight:700;font-size:14px}
.ov-btn.main{background:var(--ov-acc);border-color:var(--ov-acc);color:var(--ov-accfg)}
.scrim{position:absolute;z-index:40;inset:0;background:rgba(10,8,20,.42);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.sheet{width:min(480px,100%);max-height:calc(100% - 8px);overflow-y:auto;box-sizing:border-box;padding:24px;border-radius:var(--ov-radius);background:var(--ov-bg);color:var(--ov-fg);border:2px solid var(--ov-line);font-family:var(--ov-font);display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.sheet h2{margin:0;font-family:var(--ov-display);font-size:24px;font-weight:600}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set-group{display:flex;flex-direction:column;gap:10px}
.set-label{font-weight:800;font-size:15px}
.set-hint{font-size:13px;opacity:.75}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px 6px 16px;border-radius:var(--ov-radius);background:var(--ov-soft)}
.stepper .num{min-width:72px;text-align:center;font-family:var(--ov-display);font-size:19px;font-variant-numeric:tabular-nums}
.stepper button{width:44px;height:44px;border-radius:var(--ov-radius);border:2px solid var(--ov-line);background:var(--ov-bg);color:var(--ov-fg);font-size:20px;font-weight:800;padding:0}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:60px;height:34px;flex:none;border-radius:999px;border:2px solid var(--ov-line);padding:3px;display:flex;align-items:center;justify-content:flex-start;background:var(--ov-soft)}
.switch i{width:24px;height:24px;border-radius:50%;background:var(--ov-fg);opacity:.6}
.switch[aria-checked="true"]{justify-content:flex-end;background:var(--ov-acc);border-color:var(--ov-acc)}
.switch[aria-checked="true"] i{background:var(--ov-accfg);opacity:1}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick .sw{--sw-ring:var(--ov-fg)}
.bd-btn{width:56px;height:56px;border-radius:var(--ov-radius);border:2px solid transparent;background:var(--ov-soft);padding:6px;display:flex;align-items:center;justify-content:center}
.bd-btn[aria-checked="true"]{border-color:var(--ov-fg)}

/* ---------- CUTE ---------- */
.w-cute{font-family:Nunito,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 18%,var(--hue1) 0,transparent 38%),linear-gradient(160deg,var(--bg),var(--bg2));--focus:var(--accent);
  --ov-bg:var(--clayTop);--ov-fg:var(--text);--ov-acc:var(--btn);--ov-accfg:var(--btnText);--ov-soft:var(--well);--ov-line:var(--clayDepth);--ov-font:Nunito,sans-serif;--ov-display:Fredoka,sans-serif;--ov-radius:24px}
.w-cute .brand-name{font-family:Fredoka,sans-serif;font-weight:700;font-size:28px;letter-spacing:-.5px}
.w-cute .clay,.w-cute .ibtn,.w-cute .b{border:none;color:var(--text);background:linear-gradient(180deg,var(--clayTop),var(--clayBot));box-shadow:0 5px 0 var(--clayDepth),0 16px 24px -12px var(--shadow),inset 0 2px 0 var(--hl);border-radius:50%;transition:transform .12s,box-shadow .12s}
.w-cute .ibtn:active,.w-cute .b:active{transform:translateY(4px);box-shadow:0 1px 0 var(--clayDepth),inset 0 2px 0 var(--hl)}
.w-cute .ibtn[aria-pressed="true"]{background:linear-gradient(180deg,var(--btnTop),var(--btn));color:var(--btnText);box-shadow:0 5px 0 var(--btnShadow),inset 0 2px 0 rgba(255,255,255,.4)}
.w-cute .b{width:56px;height:56px;display:flex;align-items:center;justify-content:center;padding:0}
.w-cute .b-main{min-width:200px;height:68px;padding:0 36px;border-radius:999px;border:none;font-family:Fredoka,sans-serif;font-weight:700;font-size:26px;color:var(--btnText);background:linear-gradient(180deg,var(--btnTop),var(--btn));box-shadow:0 8px 0 var(--btnShadow),0 26px 34px -14px var(--btnShadow),inset 0 3px 0 rgba(255,255,255,.4);transition:transform .12s,box-shadow .12s}
.w-cute .b-main:active{transform:translateY(6px);box-shadow:0 2px 0 var(--btnShadow),inset 0 3px 0 rgba(255,255,255,.4)}
.w-cute .tabs{padding:6px;border-radius:999px;background:var(--well);box-shadow:inset 0 3px 8px rgba(0,0,0,.1),0 1px 0 var(--hl)}
.w-cute .tab{min-height:44px;padding:0 clamp(12px,2vw,22px);border-radius:999px;border:none;background:transparent;color:var(--text);opacity:.75;font-weight:800;font-size:15px}
.w-cute .tab[aria-selected="true"]{opacity:1;color:var(--accentText);background:linear-gradient(180deg,var(--clayTop),var(--clayBot));box-shadow:0 4px 0 var(--clayDepth),inset 0 2px 0 var(--hl)}
.w-cute .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 26%,var(--dialHi) 0%,var(--dialLo) 72%);box-shadow:0 40px 60px -26px var(--shadow),0 14px 0 -4px var(--clayDepth),inset 0 4px 0 var(--hl),inset 0 -14px 30px rgba(0,0,0,.07)}
.w-cute .well{position:absolute;inset:21%;border-radius:50%;background:radial-gradient(circle at 50% 70%,var(--dialHi) 0%,var(--well) 70%);box-shadow:inset 0 10px 22px rgba(0,0,0,.13),inset 0 -3px 0 var(--hl)}
.w-cute .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-fill{transition:stroke-dashoffset .6s linear}
.w-cute .clock{font-family:Fredoka,sans-serif;font-weight:700;font-size:calc(var(--d)*.22);letter-spacing:-1px;text-shadow:0 3px 0 var(--hl),0 10px 18px var(--shadow)}
.w-cute .cap{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.72}
.w-cute .dot{width:16px;height:16px;border-radius:50%;background:var(--well);box-shadow:inset 0 2px 4px rgba(0,0,0,.14),0 1px 0 var(--hl)}
.w-cute .dot.on{background:radial-gradient(circle at 35% 30%,#fff 0 15%,var(--accent) 45%,var(--btn) 100%);box-shadow:0 3px 6px var(--shadow)}
.w-cute .meta{font-size:13px;font-weight:800;opacity:.8}
.w-cute .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7;animation:blob 18s ease-in-out infinite alternate}
@keyframes blob{to{transform:translate(60px,-40px) scale(1.15)}}
.w-cute .deco{position:absolute;animation:float 5s ease-in-out infinite alternate;filter:drop-shadow(0 8px 8px var(--shadow))}
@keyframes float{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-16px) rotate(10deg)}}
.floor{height:128px;width:100%;max-width:1180px;margin-inline:auto;flex:none}
.shelf{position:absolute;left:0;right:0;bottom:8px;height:20px;border-radius:14px;background:linear-gradient(180deg,var(--clayTop),var(--clayBot));box-shadow:0 8px 0 var(--clayDepth),0 28px 30px -16px var(--shadow),inset 0 2px 0 var(--hl)}
.track{position:absolute;left:6px;right:330px;bottom:24px;height:92px}
@media (max-width:760px){.track{right:110px}}
.walker{position:absolute;left:0;bottom:0;width:72px;height:84px}
.walker .shadow{position:absolute;left:10px;bottom:-6px;width:52px;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.22),rgba(0,0,0,0))}
.walker .flip,.walker .bod{width:72px;height:84px}
.bod{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.05,.96)}}
.running.mode-focus .walker{animation:walk 16s linear infinite}
.running.mode-focus .flip{animation:flip 16s linear infinite}
.running.mode-focus .bod{animation:bob .45s ease-in-out infinite alternate}
.running.mode-focus .foot{transform-box:fill-box;transform-origin:center;animation:step .45s ease-in-out infinite alternate}
.running.mode-focus .foot.fb{animation-direction:alternate-reverse}
@keyframes walk{0%{left:0}50%{left:calc(100% - 72px)}100%{left:0}}
@keyframes flip{0%,49.9%{transform:scaleX(1)}50%,100%{transform:scaleX(-1)}}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-6px) rotate(4deg)}}
@keyframes step{to{transform:translateY(-5px)}}
.running:not(.mode-focus) .walker{left:calc(50% - 36px)}
.running:not(.mode-focus) .bod{animation:sip 1.4s ease-in-out infinite}
.running:not(.mode-focus) .cup,.running:not(.mode-focus) .note{display:inline}
@keyframes sip{0%,100%{transform:translateY(0) rotate(-8deg)}25%{transform:translateY(-10px)}50%{transform:rotate(8deg)}75%{transform:translateY(-10px)}}
.note{position:absolute;left:-14px;top:0;animation:note 1.6s ease-out infinite}
@keyframes note{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(10px,-34px)}}
.drink{position:absolute;right:8px;bottom:24px;width:80px;height:106px}
.drink .shadow{position:absolute;left:8px;bottom:-6px;width:66px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.22),rgba(0,0,0,0))}
.drink-label{position:absolute;right:calc(100% + 14px);bottom:14px;white-space:nowrap;text-align:right;display:flex;flex-direction:column;gap:2px}
.drink-label b{font-family:Fredoka,sans-serif;font-size:18px}
.drink-label span{font-size:13px;font-weight:800;opacity:.72}
.liquid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s linear}
.steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.25}50%{opacity:.85}}

/* ---------- MINIMAL ---------- */
.w-minimal{font-family:Karla,system-ui,sans-serif;background:var(--paper);color:var(--ink);--focus:var(--accent);
  --ov-bg:var(--paper);--ov-fg:var(--ink);--ov-acc:var(--ink);--ov-accfg:var(--paper);--ov-soft:rgba(var(--ink-rgb),.06);--ov-line:rgba(var(--ink-rgb),.3);--ov-font:Karla,sans-serif;--ov-display:'Cormorant Garamond',serif;--ov-radius:6px}
.w-minimal .seal{width:34px;height:34px;border-radius:3px;background:var(--accent);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:18px}
.w-minimal .brand-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;line-height:1}
.w-minimal .brand-sub{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.w-minimal .ibtn{border-radius:50%;border:1px solid rgba(var(--ink-rgb),.25);background:transparent;color:var(--ink)}
.w-minimal .ibtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.w-minimal .tabs{gap:clamp(18px,4vw,40px)}
.w-minimal .tab{min-height:44px;padding:0;border:none;border-bottom:1px solid transparent;background:none;color:var(--muted);font-size:12px;letter-spacing:.26em;text-transform:uppercase}
.w-minimal .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.w-minimal .enso{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-96deg)}
.w-minimal .cap{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.w-minimal .clock{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:calc(var(--d)*.34);letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.w-minimal .round{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:var(--muted)}
.w-minimal .b-main{height:56px;min-width:190px;padding:0 40px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:14px;letter-spacing:.3em;text-transform:uppercase;transition:background .25s,color .25s}
.w-minimal .b-main:hover{background:var(--ink);color:var(--paper)}
.w-minimal .b{min-height:44px;padding:0 6px;border:none;background:none;color:var(--muted);font-size:12px;letter-spacing:.24em;text-transform:uppercase}
.w-minimal .b:hover{color:var(--ink)}
.w-minimal .dot{width:10px;height:10px;box-sizing:border-box;border-radius:50%;border:1px solid var(--line)}
.w-minimal .dot.on{background:var(--accent);border-color:var(--accent)}
.w-minimal .meta{font-size:13px;color:var(--muted)}

/* ---------- 80s ---------- */
.w-eighties{font-family:Orbitron,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 40%,var(--sky3) 64%,var(--void) 64.1%);--focus:var(--sun1);
  --ov-bg:var(--void);--ov-fg:var(--texthi);--ov-acc:var(--pink);--ov-accfg:#FFFFFF;--ov-soft:rgba(var(--cyan-rgb),.08);--ov-line:var(--cyan);--ov-font:Orbitron,sans-serif;--ov-display:Audiowide,sans-serif;--ov-radius:4px}

.w-eighties .sun{position:absolute;left:50%;top:calc(64% - 190px);width:380px;height:380px;margin-left:-190px;border-radius:50%;background:linear-gradient(180deg,var(--sun1) 0%,var(--sun2) 40%,var(--pink) 78%);box-shadow:0 0 90px rgba(var(--pink-rgb),.55);-webkit-mask-image:linear-gradient(180deg,#000 0 46%,transparent 46% 50%,#000 50% 58%,transparent 58% 63%,#000 63% 70%,transparent 70% 76%,#000 76%);mask-image:linear-gradient(180deg,#000 0 46%,transparent 46% 50%,#000 50% 58%,transparent 58% 63%,#000 63% 70%,transparent 70% 76%,#000 76%)}

/* ---------- RETRO ---------- */
.w-retro{font-family:'Press Start 2P',monospace;background:var(--dark);color:var(--white);--focus:var(--yellow);
  --ov-bg:var(--panel);--ov-fg:var(--white);--ov-acc:var(--orange);--ov-accfg:var(--dark);--ov-soft:var(--dark);--ov-line:var(--white);--ov-font:'Press Start 2P',monospace;--ov-display:'Press Start 2P',monospace;--ov-radius:0px}
.w-retro .sheet,.w-retro .toast{font-size:11px;line-height:1.7}
.w-retro .sheet h2{font-size:15px}
.w-retro .set-label{font-size:11px;font-weight:400}
.w-retro .set-hint{font-size:9px}
.w-retro .toast-text b{font-size:13px}
.w-retro .toast-text span{font-size:10px}
.w-retro .stepper .num{font-size:12px}
.w-retro .brand-name{font-size:clamp(14px,2.4vw,24px);color:var(--yellow);text-shadow:3px 3px 0 var(--red)}

.w-retro .b{height:54px;padding:0 16px;font-size:11px}
.w-retro .b-main{height:58px;min-width:160px;padding:0 22px;font-size:14px;background:var(--orange);box-shadow:inset -4px -4px 0 var(--red),inset 4px 4px 0 var(--yellow),0 0 0 4px var(--dark),6px 6px 0 4px rgba(0,0,0,.5)}
.w-retro .b:active,.w-retro .b-main:active,.w-retro .ibtn:active{transform:translate(4px,4px)}
.w-retro .tab{min-height:44px;padding:0 12px;border:none;background:transparent;color:var(--grey);font-size:11px}
.w-retro .tab::before{content:"\00a0\00a0";}
.w-retro .tab[aria-selected="true"]{background:var(--dark);color:var(--white);box-shadow:0 0 0 4px var(--white)}
.w-retro .tab[aria-selected="true"]::before{content:"\25B6\00a0";color:var(--yellow)}
.w-retro .core{flex-direction:column}
.w-retro .dial{width:min(92vw,700px);height:auto;box-sizing:border-box;padding:clamp(16px,3vw,30px);background:var(--panel);box-shadow:0 0 0 4px var(--white),0 0 0 8px var(--dark),0 0 0 12px var(--grey),14px 14px 0 12px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:20px;margin:12px}
.w-retro .pxhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(9px,1.4vw,13px);color:var(--cyan)}
.w-retro .clock{text-align:center;font-size:clamp(40px,9vw,100px);line-height:1.1;color:var(--white);text-shadow:6px 6px 0 var(--plum)}
.w-retro .hp{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--yellow)}
.w-retro .hpbar{flex:1;height:30px;box-sizing:border-box;padding:4px;background:var(--dark);box-shadow:0 0 0 4px var(--white);display:flex;gap:3px}
.w-retro .blk{flex:1;background:var(--panel)}
.w-retro .blk.on{background:var(--lime);box-shadow:inset 0 -4px 0 var(--green)}
.w-retro .heart{color:var(--grey2)}
.w-retro .heart.on{color:var(--red)}
.w-retro .side{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:18px}
.w-retro .blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.w-retro .hint{font-size:10px;color:var(--cyan)}
.w-retro .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:200px}
.w-retro .hero{position:absolute;left:7%;bottom:24px;animation:hop .8s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-8px)}}
.running .hero{animation-duration:.4s}

/* ---------- DARK ACADEMIA ---------- */
.w-academia{font-family:'EB Garamond',Georgia,serif;color:var(--text);background:radial-gradient(ellipse at 50% 38%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);--focus:var(--brass);
  --ov-bg:var(--bg2);--ov-fg:var(--text);--ov-acc:var(--accent);--ov-accfg:var(--btntext);--ov-soft:rgba(var(--brass-rgb),.1);--ov-line:rgba(var(--brass-rgb),.55);--ov-font:'EB Garamond',serif;--ov-display:Cinzel,serif;--ov-radius:4px}
.w-academia .brand-name{font-family:Cinzel,serif;font-size:clamp(13px,1.6vw,16px);letter-spacing:.3em;color:var(--brass)}
.w-academia .ibtn{border-radius:50%;border:1px solid rgba(var(--brass-rgb),.6);background:transparent;color:var(--brass)}
.w-academia .ibtn[aria-pressed="true"]{background:rgba(var(--brass-rgb),.2)}
.w-academia .tabs{gap:clamp(16px,3vw,30px)}
.w-academia .tab{min-height:44px;padding:0 2px;border:none;border-bottom:1px solid transparent;background:none;color:var(--muted2);font-family:Cinzel,serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase}
.w-academia .tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--brass)}
.w-academia .crown{position:absolute;left:50%;top:-22px;width:28px;height:22px;margin-left:-14px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--brasslt),var(--crown))}
.w-academia .face{position:absolute;inset:0;box-sizing:border-box;border-radius:50%;border:calc(var(--d)*.03) solid var(--brass2);background:radial-gradient(circle at 38% 30%,var(--face1) 0%,var(--face2) 62%,var(--face3) 100%);box-shadow:0 0 0 3px var(--brassdk),inset 0 0 0 3px var(--brasslt),inset 0 0 40px rgba(var(--brassdk-rgb),.45),0 40px 70px rgba(0,0,0,.6)}
.w-academia .watch svg{position:absolute;inset:0;width:100%;height:100%}
.w-academia .hand{transform-box:view-box;transform-origin:200px 200px;transition:transform .6s linear}
.w-academia .dial-text{top:52%;bottom:auto;justify-content:flex-start}
.w-academia .clock{font-weight:500;font-size:calc(var(--d)*.12);color:var(--ink2)}
.w-academia .cap{font-family:Cinzel,serif;font-size:11px;letter-spacing:.3em;color:var(--caption)}
.w-academia .b-main{height:56px;min-width:190px;padding:0 34px;border:1px solid var(--brass);background:var(--accent);color:var(--btntext);font-family:Cinzel,serif;font-weight:600;font-size:15px;letter-spacing:.24em;box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px rgba(var(--brass-rgb),.7),0 12px 24px rgba(0,0,0,.4)}
.w-academia .b-main:hover{background:var(--accenthv)}
.w-academia .b{height:48px;padding:0 22px;border:1px solid rgba(var(--brass-rgb),.6);background:transparent;color:var(--text);font-family:Cinzel,serif;font-size:13px;letter-spacing:.2em}
.w-academia .dot{width:13px;height:13px;box-sizing:border-box;transform:rotate(45deg);border:1px solid var(--muted3)}
.w-academia .dot.on{background:var(--brass);border-color:var(--brass)}
.w-academia .meta{font-family:Cinzel,serif;font-size:12px;letter-spacing:.24em;color:var(--brass)}
.w-academia .desk{position:absolute;left:0;right:0;bottom:0;height:11%;background:linear-gradient(180deg,var(--ink),var(--ink2));border-top:3px solid var(--deskline)}
.w-academia .quote{position:absolute;left:clamp(16px,5vw,80px);top:26%;width:270px;display:flex;flex-direction:column;gap:14px}
.w-academia .quote i{font-size:38px;line-height:1.05}
.w-academia .quote span{font-size:17px;line-height:1.5;color:var(--muted)}
.w-academia .shelfart{position:absolute;right:clamp(16px,5vw,80px);bottom:11%}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.8s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1deg)}30%{transform:scale(.94,1.06) rotate(2deg)}60%{transform:scale(1.04,.96) rotate(-2deg)}}
@media (max-width:1100px){.w-academia .quote{display:none}}


/* speech bubbles from each world's avatar */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.say{position:absolute;left:0;bottom:calc(100% + 12px);z-index:6;width:max-content;max-width:230px;box-sizing:border-box;padding:10px 14px;border-radius:var(--ov-radius);background:var(--ov-bg);color:var(--ov-fg);border:2px solid var(--ov-line);font-family:var(--ov-font);font-size:13px;font-weight:700;line-height:1.35;box-shadow:0 12px 26px -12px rgba(0,0,0,.45);opacity:0;transform:translateY(8px) scale(.92);transform-origin:20px 100%;transition:opacity .25s,transform .3s cubic-bezier(.3,1.5,.6,1);pointer-events:none}
.say::after{content:"";position:absolute;left:22px;bottom:-8px;width:12px;height:12px;background:var(--ov-bg);border-right:2px solid var(--ov-line);border-bottom:2px solid var(--ov-line);transform:rotate(45deg)}
.say.show{opacity:1;transform:translateY(0) scale(1)}
.w-retro .say{font-size:9px;line-height:1.6}
.comp{position:absolute;z-index:2;left:clamp(16px,4vw,56px);bottom:24px}
.w-minimal .comp{bottom:clamp(20px,4vh,44px)}
.w-academia .comp{bottom:calc(11% - 4px)}
.w-retro .comp{left:7%}
.w-retro .comp .hero{position:static;display:block}
.w-eighties .comp{bottom:22px}
.brk{display:none}
.running:not(.mode-focus) .brk{display:block}
/* minimal: breathing circle during rests */
.w-minimal .breath{position:absolute;inset:24%;border-radius:50%;background:radial-gradient(circle,rgba(var(--accent-rgb),.22),rgba(var(--accent-rgb),.06));opacity:0;transform:scale(.55)}
.w-minimal.running:not(.mode-focus) .breath{animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.9;transform:scale(.55)}50%{opacity:1;transform:scale(1.05)}}
.w-minimal .petal{position:absolute;top:-30px;width:14px;height:14px;border-radius:0 70% 0 70%;background:rgba(var(--accent-rgb),.55);animation:fall 9s linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-120px,110vh) rotate(540deg)}}
/* 80s: neon car cruising and shooting stars during breaks */
.w-eighties .car{position:absolute;top:calc(64% + 6px);left:-220px;animation:drive 7s linear infinite}
@keyframes drive{to{left:calc(100% + 40px)}}
.w-eighties .shoot{position:absolute;width:120px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#FFFFFF);transform:rotate(-20deg);animation:shoot 3.4s ease-in infinite;opacity:0}
@keyframes shoot{0%{opacity:0;translate:0 0}10%{opacity:1}40%{opacity:0;translate:-340px 125px}100%{opacity:0;translate:-340px 125px}}
.w-eighties.running:not(.mode-focus) .sun{animation:sunpulse 2.4s ease-in-out infinite alternate}
@keyframes sunpulse{to{box-shadow:0 0 150px rgba(var(--pink-rgb),.95);filter:brightness(1.15)}}
.w-eighties .robot{animation:rbob 1.8s ease-in-out infinite}
@keyframes rbob{50%{transform:translateY(-4px)}}
/* retro: hero rests at a campfire during breaks */
.running:not(.mode-focus) .hero{animation:none !important}
.w-retro .fire{position:absolute;left:92px;bottom:0;animation:fire .5s steps(2) infinite}
@keyframes fire{50%{transform:scaleX(-1)}}
.w-retro .zz{position:absolute;left:44px;bottom:84px;font-size:14px;color:var(--cyan);animation:zz 2.4s ease-out infinite;opacity:0}
.w-retro .zz:nth-child(2){animation-delay:.8s}.w-retro .zz:nth-child(3){animation-delay:1.6s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-50px)}}
/* academia: tea by the candle during recess */
.w-academia .owl{animation:owl 6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes owl{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-6deg)}97%{transform:rotate(6deg)}}
.w-academia .tea{position:absolute;left:78px;bottom:0}
.w-academia .cglow{transition:transform 1.2s,opacity 1.2s}
.w-academia.running:not(.mode-focus) .cglow{transform:scale(1.35);opacity:1}
.w-academia .owl-eyes{transition:opacity .4s}
.w-academia.running:not(.mode-focus) .owl-eyes{opacity:0}
.w-academia .owl-shut{opacity:0;transition:opacity .4s}
.w-academia.running:not(.mode-focus) .owl-shut{opacity:1}
@media (max-width:760px){.comp{bottom:12px}.w-cute .say{max-width:190px}}


/* ---------- depth + motion ---------- */
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.38),rgba(255,255,255,0) 45%);opacity:0;transition:opacity .25s}
.card:hover::after{opacity:1}
.card .pv{transform:translateZ(34px)}
.card .card-body{transform:translateZ(18px)}
.home{position:relative;z-index:1}
.home-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.home-bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.home-bg i:nth-child(1){left:-8%;top:-10%;width:46vw;height:46vw;background:var(--h-b1)}
.home-bg i:nth-child(2){right:-10%;top:18%;width:40vw;height:40vw;background:var(--h-b2);animation-delay:-7s}
.home-bg i:nth-child(3){left:30%;bottom:-20%;width:44vw;height:44vw;background:var(--h-b3);animation-delay:-14s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.15)}}
.shine{background:linear-gradient(90deg,#E8604C,#FF2975,#7B6CFF,#3FA87F,#B08D57,#E8604C);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite;font-style:italic;padding-right:.08em}
@keyframes shine{to{background-position:300% 0}}
.home.intro h1{animation:fadeUp .7s ease-out backwards}
.home.intro .home-lede{animation:fadeUp .7s .1s ease-out backwards}
.home.intro .card{animation:rise .85s cubic-bezier(.2,.9,.25,1.15) backwards;animation-delay:calc(var(--i) * 80ms + 180ms)}
.home.intro .home-foot{animation:fadeUp .7s .6s ease-out backwards}
@keyframes rise{from{opacity:0;transform:perspective(900px) rotateX(30deg) translateY(70px) scale(.92)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}}
.world .dial{transform:perspective(1000px) rotateX(calc(var(--ty,0) * -7deg)) rotateY(calc(var(--tx,0) * 9deg));transform-style:preserve-3d;transition:transform .35s ease-out}
.world .dial-text{transform:translateZ(46px)}
.w-cute .well{transform:translateZ(8px)}
.w-cute .ring{transform:translateZ(22px) rotate(-90deg)}
.w-minimal .enso{transform:translateZ(20px) rotate(-96deg)}
.w-minimal .breath{translate:0 0 10px}
.w-academia .watch svg{transform:translateZ(14px)}
.w-academia .dial-text{transform:translateZ(40px)}
.w-eighties .dial>*,.w-retro .dial>*{transform:translateZ(30px)}
.world .bg-layer{transform:translate(calc(var(--tx,0) * -18px),calc(var(--ty,0) * -12px));transition:transform .6s ease-out}
.world .floor{transform:translateX(calc(var(--tx,0) * 8px));transition:transform .6s ease-out}
.world.intro{animation:fadeIn .35s ease-out backwards}
@keyframes fadeIn{from{opacity:0}}
.world.intro .tabs,.world.intro .side,.world.intro .bar{animation:fadeUp .6s .35s ease-out backwards}
@keyframes worldIn{from{opacity:0;transform:perspective(1400px) translateZ(-280px) rotateX(10deg)}}
@keyframes dialIn{from{opacity:0;transform:perspective(1000px) rotateY(-50deg) scale(.75)}}
.world .b-main{transition:translate .2s ease-out,transform .12s,box-shadow .2s,background .25s,color .25s}
.world .b-main:hover{translate:0 -3px}
.dot.on{animation:dotpop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes dotpop{from{scale:.2}}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}


/* ---------- welcome: 3D portal hall ---------- */
.hall{position:relative;flex:1;min-height:100%;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;padding-inline:clamp(16px,4vw,56px);padding-block:clamp(16px,3vh,30px);color:var(--hfg);font-family:var(--f-body);--step:min(330px,40vw);--pw:min(360px,64vw);--ph:min(400px,46vh)}
.hall-bg{position:absolute;inset:0;z-index:0}
.hall-bg div{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.hall-bg div.on{opacity:1}
.hall-bar,.hall-stage,.hall-info{position:relative;z-index:1}
.hall-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hall-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.02em}
.hall-brand small{font-family:var(--f-body);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.hall-count{font-size:14px;opacity:.8}
.hall-eyebrow{text-align:center;font-size:12px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;opacity:.75;margin-top:clamp(6px,2vh,18px)}
.hall-stage{flex:1;min-height:calc(var(--ph) + 60px);display:flex;align-items:center;justify-content:center;perspective:1400px;touch-action:pan-y}
.carousel{position:relative;width:var(--pw);height:var(--ph);transform-style:preserve-3d}
.portal{position:absolute;inset:0;border:none;padding:0;border-radius:28px;background:transparent;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s,filter .7s;-webkit-box-reflect:below 16px linear-gradient(transparent 72%,rgba(255,255,255,.16))}
.portal-pv{position:absolute;inset:0;border-radius:28px;overflow:hidden;box-shadow:0 40px 70px -30px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.18)}
.portal[aria-checked="true"] .portal-pv{box-shadow:0 50px 90px -30px rgba(0,0,0,.7),0 0 0 3px var(--hfg)}
.portal:not([aria-checked="true"]){filter:saturate(.8) brightness(.85)}
.portal .world.preview{--d:430px}
.portal .w-eighties.preview .dial{width:560px}.portal .w-eighties.preview .clock{font-size:118px}
.portal .w-retro.preview .dial{width:440px}.portal .w-retro.preview .clock{font-size:62px}
.nav-arrow{position:absolute;top:50%;z-index:20;width:56px;height:56px;margin-top:-28px;border-radius:50%;border:2px solid var(--hfg);background:rgba(0,0,0,.14);color:var(--hfg);display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .2s}
.nav-arrow:hover{transform:scale(1.08)}
.nav-arrow.prev{left:clamp(4px,4vw,60px)}.nav-arrow.next{right:clamp(4px,4vw,60px)}
.hall-info{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-bottom:4px}
.hall-name{margin:0;font-weight:400;font-size:clamp(34px,5vw,56px);line-height:1.05;text-wrap:balance;transition:opacity .3s}
.hall-desc{margin:0;max-width:48ch;font-size:16px;line-height:1.5;opacity:.82}
.hall-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 22px}
.hall-row .sw{--sw-ring:var(--hfg)}
.hall-sound{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hall-enter{height:56px;display:inline-flex;align-items:center;gap:12px;padding:0 30px;border-radius:999px;border:none;background:var(--hacc);color:var(--haccfg);font-weight:800;font-size:16px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);transition:transform .2s}
.hall-enter:hover{transform:translateY(-2px) scale(1.03)}
.hall-dots{display:flex;gap:8px}
.hall-dots span{width:8px;height:8px;border-radius:50%;background:var(--hfg);opacity:.3;transition:opacity .3s,transform .3s}
.hall-dots span.on{opacity:1;transform:scale(1.4)}
.hall.intro .portal{animation:portalIn 1s cubic-bezier(.2,.9,.25,1.1) backwards;animation-delay:calc(var(--i) * 70ms + 100ms)}
@keyframes portalIn{from{opacity:0;translate:0 90px;scale:.8}}
.hall.intro .hall-info{animation:fadeUp .7s .45s ease-out backwards}
.zoomer{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
.zoomworld{position:absolute;inset:0;min-height:0;padding:0;align-items:center;justify-content:center;transform-origin:50% 50%}
.zoomdial{transform-origin:50% 50%}
@media (max-width:640px){.hall{--step:62vw}.nav-arrow{width:46px;height:46px;margin-top:-23px}.portal{-webkit-box-reflect:unset}}


/* ---------- right-hand dock + frosted panels ---------- */
.w-cute{--ov-bg-rgb:var(--clayTop-rgb)}.w-minimal{--ov-bg-rgb:var(--paper-rgb)}.w-eighties{--ov-bg-rgb:var(--void-rgb)}.w-retro{--ov-bg-rgb:var(--panel-rgb)}.w-academia{--ov-bg-rgb:var(--bg2-rgb)}
.dock{position:absolute;z-index:22;top:clamp(14px,2.6vh,30px);right:clamp(16px,4vw,56px);display:flex;flex-direction:column;gap:12px}
.dock .ibtn[aria-expanded="true"]{outline:3px solid var(--ov-acc);outline-offset:3px}
.dock .tip{position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:rgba(var(--ov-bg-rgb),.85);color:var(--ov-fg);opacity:0;pointer-events:none;transition:opacity .15s}
.dock .ibtn{position:relative}
.dock .ibtn:hover .tip,.dock .ibtn:focus-visible .tip{opacity:1}
.dock .ibtn[aria-expanded="true"] .tip{opacity:0}
.panel{position:absolute;z-index:21;top:clamp(14px,2.6vh,30px);right:calc(clamp(16px,4vw,56px) + 66px);width:min(350px,calc(100% - 130px));max-height:calc(100% - 40px);overflow-y:auto;box-sizing:border-box;padding:18px;display:flex;flex-direction:column;gap:14px;border-radius:var(--ov-radius);background:rgba(var(--ov-bg-rgb),.58);-webkit-backdrop-filter:blur(20px) saturate(1.35);backdrop-filter:blur(20px) saturate(1.35);border:1.5px solid var(--ov-line);color:var(--ov-fg);font-family:var(--ov-font);box-shadow:0 24px 50px -22px rgba(0,0,0,.5);transform-origin:100% 0;animation:panelIn .3s cubic-bezier(.3,1.4,.6,1)}
@keyframes panelIn{from{opacity:0;transform:translateX(14px) scale(.94)}}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-head b{font-family:var(--ov-display);font-size:20px;font-weight:600}
.panel .ov-btn{background:rgba(var(--ov-bg-rgb),.5)}
.panel .ov-btn.main{background:var(--ov-acc)}
.panel .stepper{background:rgba(var(--ov-bg-rgb),.55)}
.w-retro .panel{font-size:11px;line-height:1.7}.w-retro .panel-head b{font-size:13px}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.panel{background:rgba(var(--ov-bg-rgb),.95)}}
@media (max-width:640px){
  .dock{flex-direction:row;gap:8px}
  .dock .ibtn{width:44px;height:44px}
  .dock .tip{display:none}
  .world .brand{display:none}
  .panel{top:calc(clamp(14px,2.6vh,30px) + 58px);left:16px;right:16px;width:auto;max-height:calc(100% - 100px)}
}

/* ---------- previews on the welcome cards ---------- */
.world.preview{position:absolute;left:0;top:0;width:200%;height:200%;min-height:0;padding:0;transform:scale(.5);transform-origin:0 0;pointer-events:none;align-items:center;justify-content:center;--d:270px}

.preview .comp,.preview .say{display:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

var tiltRaf = 0, tx = 0, ty = 0;
